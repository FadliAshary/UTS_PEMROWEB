<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Saya</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(180deg, crimson, #000);
            color: white;
        }

        .navbar {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .navbar a {
            background: rgba(255,255,255,0.15);
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background: crimson;
        }

        .container {
            background: rgba(255,255,255,0.9);
            color: #333;
            margin: 60px auto;
            width: 80%;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            font-weight: 600;
            display: inline-block;
            padding-bottom: 3px;
            border-bottom: 6px solid;
            border-image: linear-gradient(to right, crimson, black) 1;
        }

        .nama-box {
            margin: 20px auto;
            width: fit-content;
            padding: 10px 20px;
            border-radius: 8px;
            color: white;
            background: linear-gradient(to right, crimson, black);
            font-size: 22px;
            font-weight: bold;
        }
    </style>

    <script>
        alert("Halo, selamat datang di website saya!");
        var nama = prompt("Masukkan nama Anda:");
    </script>
</head>
<body>

    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="pendidikan.html">Riwayat Pendidikan</a>
    </div>

    <div class="container">
        <h1>Home</h1>

        <h2>Selamat Datang di Dunia Saya</h2>

        <div id="namaBlock"></div>

        <script>
            document.getElementById("namaBlock").innerHTML =
                '<div class="nama-box">' + nama + '</div>';
        </script>

    </div>

</body>
</html>
